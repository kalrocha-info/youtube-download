name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Compile Python modules
        run: >
          python -m py_compile
          src\youtube_download\__init__.py
          src\youtube_download\__main__.py
          src\youtube_download\app.py
          src\youtube_download\downloader.py
          src\youtube_download\ffmpeg_locator.py
          tests\test_downloader.py
