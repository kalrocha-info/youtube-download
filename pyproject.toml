[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-download"
version = "1.0.1"
description = "Aplicativo desktop para baixar vídeos e músicas do YouTube."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.3.14",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
]

[project.scripts]
youtube-download = "youtube_download.app:main"

[tool.setuptools.packages.find]
where = ["src"]
